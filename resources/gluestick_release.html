        content="Vision-Language-Action (VLA) models have advanced robotic capabilities
            but remain challenging to deploy on resource-limited hardware. Pruning
            has enabled efficient compression of large language models (LLMs), yet it
            is largely understudied in robotics. Surprisingly, we observe that pruning
            VLA models leads to drastic degradation and increased safety violations.
            We introduce GLUESTICK, a post-pruning recovery method that restores much of
             the original model's functionality while retaining sparsity benefits" />

            <script>
            // Start navigation videos at custom times
            const navGlue = document.querySelector('video source[src*="navigation_gluestick.mp4"]')?.parentElement;
            const navPruned = document.querySelector('video source[src*="navigation_pruned.mp4"]')?.parentElement;

            if (navGlue) {
              navGlue.currentTime = 17;  // start at 17 seconds
              navGlue.play();

              // Loop between 17s and 43s
              navGlue.addEventListener('timeupdate', () => {
                if (navGlue.currentTime >= 43) {
                  navGlue.currentTime = 17;  // jump back to start time
                  navGlue.play();
                }
                });
            }
            

            if (navPruned) {
              navPruned.currentTime = 6;  // start at 6 seconds
              navPruned.play();
            }
            </script>
